# HERITIA — Single Ingress N2 (NoyauNeria2.0)
# À inclure depuis le nginx / Caddy / Traefik du point d'entrée NeriaCorp.
# Domaine : heritia.neriacorp.com
#
# Variables (centralisées côté proxy N2 — voir heritia.env.example) :
#   HERITIA_WEB_UPSTREAM  → SPA React (Railway heritia-web)
#   HERITIA_API_UPSTREAM  → FastAPI (Railway heritia-api)

map $host $n2_heritia_tenant {
    default "";
    heritia.neriacorp.com "heritia";
}

# --- Upstreams Railway (HTTPS) ---
upstream heritia_web {
    server heritia-web-production.up.railway.app:443;
    keepalive 8;
}

upstream heritia_api {
    server heritia-api-production.up.railway.app:443;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name heritia.neriacorp.com;

    # TLS : certificat géré par N2 (Let's Encrypt) ou Cloudflare Full (strict)
    # ssl_certificate     /etc/n2/certs/heritia.neriacorp.com/fullchain.pem;
    # ssl_certificate_key /etc/n2/certs/heritia.neriacorp.com/privkey.pem;

    # Empêche le fallback vers le shell PWA N2 Core pour ce host
    set $n2_bypass_shell 1;

    # --- API backend (priorité sur le catch-all SPA) ---
    location /api/ {
        proxy_pass https://heritia_api/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host heritia-api-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host heritia.neriacorp.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-N2-Tenant heritia;
        proxy_set_header X-N2-Route heritia-api;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Health frontend (smoke test déploiement) ---
    location = /health {
        proxy_pass https://heritia_web/health;
        proxy_ssl_server_name on;
        proxy_set_header Host heritia-web-production.up.railway.app;
        proxy_set_header X-Forwarded-Host heritia.neriacorp.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-N2-Tenant heritia;
    }

    # --- SPA React HERITIA (catch-all) ---
    location / {
        proxy_pass https://heritia_web;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host heritia-web-production.up.railway.app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host heritia.neriacorp.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-N2-Tenant heritia;
        proxy_set_header X-N2-Route heritia-web;
        proxy_read_timeout 60s;
    }
}
